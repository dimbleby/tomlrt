[project]
name = "tomlrt"
version = "2.2.0"
description = "A format-preserving TOML reader and writer for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "David Hotham", email = "david.hotham@blueyonder.co.uk" }]
keywords = [
  "toml",
  "toml-parser",
  "toml-writer",
  "tomlrt",
  "format-preserving",
  "round-trip",
  "config",
  "configuration",
  "pyproject",
]
dependencies = ["typing_extensions>=4; python_version < '3.12'"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/dimbleby/tomlrt"
Documentation = "https://dimbleby.github.io/tomlrt/"
Issues = "https://github.com/dimbleby/tomlrt/issues"
Changelog = "https://github.com/dimbleby/tomlrt/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "hypothesis>=6",
  "mypy>=2.1",
  "pytest-cov>=5",
  "pytest>=9",
  "tomli>=2.4",
]
docs = [
  "mkdocstrings[python]>=0.27",
  "zensical>=0.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest]
addopts = ["-ra", "-m", "not slow"]
testpaths = ["tests"]
strict = true
markers = [
  "slow: property-based / fuzz tests",
]

[tool.coverage.run]
source = ["src/tomlrt"]
branch = true

[tool.coverage.report]
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "pragma: no cover",
]

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
  "deprecated",
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "C90",                    # mccabe
  "COM",                    # flake8-commas
  "CPY",                    # flake8-copyright
  "ERA",                    # eradicate
  "PD",                     # pandas-vet
  "PLR",                    # pylint-refactor
  "ANN401",                 # any-type
  "E203",                   # whitespace before ':'
  "S101",                   # assert-used
]
extend-safe-fixes = ["TC"]
unfixable = ["F841"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "DOC"]
"benchmarks/**" = ["T201"]
