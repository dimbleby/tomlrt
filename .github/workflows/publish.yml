name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Never cancel an in-flight publish: a half-completed release (tag pushed,
# artifact missing) is worse than two overlapping runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          PROJECT_VERSION=$(python -c '
            import tomllib
            with open("pyproject.toml", "rb") as f:
                print(tomllib.load(f)["project"]["version"])
            ')
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag $REF_NAME (version $TAG_VERSION) does not match pyproject version $PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tomlrt
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/
