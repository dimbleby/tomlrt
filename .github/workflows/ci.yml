name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions-lock:
    name: Verify action lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify action lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: test (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        include:
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Check lockfile
        run: uv lock --check

      - name: Install project
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        shell: bash
        run: uv sync -p "$PYTHON_VERSION"

      - name: Install ruff
        uses: astral-sh/ruff-action@v4.1.0

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: ty check
        run: uvx ty check

      - name: Vendor toml-test corpus
        run: git clone --depth 1 https://github.com/toml-lang/toml-test vendor/toml-test

      - name: pytest
        run: uv run pytest --cov

      - name: mypy
        run: uv run mypy

      - name: pytest (slow)
        run: uv run pytest -m slow

  docs:
    name: docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: zensical build
        run: uv run zensical build
